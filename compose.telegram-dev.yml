services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.48.6
    ports:
      - "127.0.0.1:5680:5678"
    environment:
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_RESTRICT_FILE_ACCESS_TO: "/files"
    networks:
      - default
      - telegram_internal
    volumes:
      - n8n_dev:/home/node/.n8n
      - telegram_incoming:/files/incoming:ro
      - telegram_records:/files/records:ro

  telegram-relay:
    build: ./services/telegram-relay
    environment:
      TELEGRAM_DEV_CALLBACKS: "${TELEGRAM_DEV_CALLBACKS:-0}"
      TELEGRAM_POLLING: "${TELEGRAM_POLLING:-0}"
      TELEGRAM_EXPECTED_BOT: "Test_Social_Hub_bot"
      TELEGRAM_WORKFLOW_URL: "http://n8n:5678/webhook/social-hub/telegram-intake"
    volumes:
      - telegram_records:/data/records
      - telegram_incoming:/data/incoming
      - ./projects:/projects:ro
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    secrets:
      - telegram_bot_token
      - telegram_relay_key
      - telegram_allowed_chats
    networks:
      - telegram_internal
      - telegram_egress

secrets:
  telegram_bot_token:
    file: ./secrets/telegram-dev/bot-token
  telegram_relay_key:
    file: ./secrets/telegram-dev/relay-key
  telegram_allowed_chats:
    file: ./secrets/telegram-dev/allowed-chats

networks:
  telegram_internal:
    internal: true
  telegram_egress:

volumes:
  n8n_dev:
  telegram_records:
  telegram_incoming:
